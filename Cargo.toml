[package]
name = "bloop"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A local-first native AI desktop island"
license = "MIT"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "crisp"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.41", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
global-hotkey = "0.9"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
undocumented_unsafe_blocks = "deny"
