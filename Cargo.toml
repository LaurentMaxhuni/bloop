[package]
name = "bloop"
version = "0.5.0"
edition = "2024"
rust-version = "1.92"
description = "A local-first native AI desktop notch"
license = "MIT"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu-bare", "tokio", "crisp", "canvas", "markdown", "highlighter"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "process", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.23"
form_urlencoded = "1"
httparse = "1"
ring = "0.17"

[target.'cfg(windows)'.dependencies]
# Select only DirectX 12 instead of loading unused GPU backends on Windows.
wgpu = { version = "27", default-features = false, features = ["std", "wgsl", "dx12"] }
tray-icon = "0.26"
global-hotkey = "0.9"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_Security", "Win32_System_Registry", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_UI_Controls_Dialogs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
